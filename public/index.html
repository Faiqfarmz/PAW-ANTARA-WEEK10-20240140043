<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tanya AI — CS Bot</title>
<style>
  :root{
    --bg: #F6F7F5;
    --surface: #FFFFFF;
    --ink: #1E2A24;
    --ink-soft: #5B6B62;
    --accent: #2F6F5E;
    --accent-soft: #E4EFEA;
    --accent-deep: #1F4C3F;
    --line: #E1E5E1;
    --bot-bubble: #EEF3F0;
    --user-bubble: #2F6F5E;
    --radius: 16px;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }

  .app{
    width:100%;
    max-width: 480px;
    height: min(720px, 92vh);
    background: var(--surface);
    border-radius: 24px;
    box-shadow: 0 1px 2px rgba(30,42,36,0.04), 0 16px 40px rgba(30,42,36,0.10);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border: 1px solid var(--line);
  }

  /* header */
  .header{
    padding: 18px 20px;
    display:flex;
    align-items:center;
    gap: 12px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .avatar{
    width: 38px; height:38px;
    border-radius: 12px;
    background: linear-gradient(155deg, var(--accent), var(--accent-deep));
    display:flex; align-items:center; justify-content:center;
    color:white; font-weight:700; font-size:15px;
    flex-shrink:0;
  }
  .header-text{ flex:1; min-width:0; }
  .header-text .name{ font-weight:600; font-size:15px; letter-spacing:-0.01em; }
  .header-text .status{ font-size:12.5px; color: var(--ink-soft); display:flex; align-items:center; gap:5px; margin-top:1px;}
  .dot{ width:6px; height:6px; border-radius:50%; background:#4CAF7D; display:inline-block; }

  /* consent toggle */
  .consent{
    display:flex; align-items:center; gap:8px;
    font-size:11.5px; color: var(--ink-soft);
    flex-shrink:0;
    text-align:right;
    line-height:1.25;
  }
  .switch{
    position:relative; width:34px; height:20px; flex-shrink:0;
  }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{
    position:absolute; cursor:pointer; inset:0;
    background:#D8DED9; border-radius:999px; transition:.2s;
  }
  .slider::before{
    content:""; position:absolute; width:16px; height:16px; left:2px; top:2px;
    background:white; border-radius:50%; transition:.2s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  input:checked + .slider{ background: var(--accent); }
  input:checked + .slider::before{ transform: translateX(14px); }

  /* messages */
  .messages{
    flex:1;
    overflow-y:auto;
    padding: 18px 16px;
    display:flex;
    flex-direction:column;
    gap: 10px;
    scroll-behavior:smooth;
  }
  .row{ display:flex; }
  .row.user{ justify-content:flex-end; }
  .row.bot{ justify-content:flex-start; }
  .bubble{
    max-width: 78%;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.bot .bubble{
    background: var(--bot-bubble);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }
  .row.user .bubble{
    background: var(--user-bubble);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .typing{
    display:inline-flex; gap:4px; align-items:center; padding: 4px 2px;
  }
  .typing span{
    width:5px; height:5px; border-radius:50%;
    background: var(--ink-soft);
    opacity:.5;
    animation: blink 1.1s infinite;
  }
  .typing span:nth-child(2){ animation-delay:.15s; }
  .typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes blink{ 0%,80%,100%{ opacity:.35 } 40%{ opacity:1 } }

  .empty{
    margin: auto;
    text-align:center;
    color: var(--ink-soft);
    font-size: 13.5px;
    max-width: 260px;
    line-height:1.6;
  }
  .empty b{ color: var(--ink); }

  /* composer */
  .composer{
    padding: 12px 14px;
    border-top: 1px solid var(--line);
    display:flex;
    gap: 8px;
    align-items:flex-end;
    background: var(--surface);
  }
  .composer textarea{
    flex:1;
    resize:none;
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 14px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    max-height: 100px;
    outline:none;
    transition: border-color .15s;
  }
  .composer textarea:focus{ border-color: var(--accent); }
  .send{
    width: 40px; height:40px;
    border-radius: 12px;
    border:none;
    background: var(--accent);
    color:white;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition: transform .1s, background .15s;
  }
  .send:hover{ background: var(--accent-deep); }
  .send:active{ transform: scale(0.94); }
  .send:disabled{ opacity:.4; cursor:not-allowed; }
  .send svg{ width:17px; height:17px; }

  .footnote{
    font-size: 10.5px;
    color: var(--ink-soft);
    text-align:center;
    padding: 0 16px 10px;
  }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius:8px; }
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <div class="avatar">CS</div>
    <div class="header-text">
      <div class="name">Tanya AI</div>
      <div class="status"><span class="dot"></span> Siap bantu soal produk</div>
    </div>
    <label class="consent">
      <span class="switch">
        <input type="checkbox" id="saveToggle">
        <span class="slider"></span>
      </span>
      Simpan<br>riwayat
    </label>
  </div>

  <div class="messages" id="messages">
    <div class="empty" id="emptyState">
      <b>Tanyakan apa saja soal produk kami</b><br>
      Nyalakan "Simpan riwayat" di pojok kanan atas kalau kamu mau percakapan ini diingat lain kali.
    </div>
  </div>

  <div class="composer">
    <textarea id="input" placeholder="Tulis pertanyaan..." rows="1"></textarea>
    <button class="send" id="sendBtn" aria-label="Kirim">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <div class="footnote">Jawaban dihasilkan AI, bisa saja kurang akurat.</div>
</div>

<script>
/* ====== SESUAIKAN DENGAN ROUTES KAMU KALAU BEDA ====== */
const API_BASE = "";                              // isi kalau backend beda origin, misal "http://localhost:3000"
const CHAT_ENDPOINT = "/api/chat";                 // endpoint kirim pesan ke bot
const HISTORY_CREATE_ENDPOINT = "/api/chat/history";        // endpoint simpan 1 pesan (POST)
const HISTORY_READ_ENDPOINT = (sid) => `/api/chat/history/${sid}`; // endpoint ambil riwayat (GET)
/* ====================================================== */

const messagesEl = document.getElementById('messages');
const emptyState = document.getElementById('emptyState');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const saveToggle = document.getElementById('saveToggle');

// session_id persisten per browser, dipakai buat mengaitkan riwayat
function getSessionId(){
  let sid = localStorage.getItem('cs_session_id');
  if(!sid){
    sid = crypto.randomUUID();
    localStorage.setItem('cs_session_id', sid);
  }
  return sid;
}
const sessionId = getSessionId();

// pulihkan pilihan "simpan riwayat" dari kunjungan sebelumnya
saveToggle.checked = localStorage.getItem('cs_save_history') === 'true';
saveToggle.addEventListener('change', () => {
  localStorage.setItem('cs_save_history', saveToggle.checked);
});

function clearEmptyState(){
  if(emptyState) emptyState.remove();
}

function addBubble(role, text){
  clearEmptyState();
  const row = document.createElement('div');
  row.className = `row ${role}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

function addTyping(){
  const row = document.createElement('div');
  row.className = 'row bot';
  row.id = 'typingRow';
  row.innerHTML = `<div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>`;
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function removeTyping(){
  document.getElementById('typingRow')?.remove();
}

async function saveHistory(role, message){
  if(!saveToggle.checked) return;
  try{
    await fetch(API_BASE + HISTORY_CREATE_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, role, message })
    });
  }catch(e){
    console.error('Gagal simpan riwayat:', e);
  }
}

async function loadHistory(){
  if(!saveToggle.checked) return;
  try{
    const res = await fetch(API_BASE + HISTORY_READ_ENDPOINT(sessionId));
    if(!res.ok) return;
    const data = await res.json();
    const list = Array.isArray(data) ? data : (data.data || []);
    if(list.length === 0) return;
    clearEmptyState();
    list.forEach(item => addBubble(item.role === 'user' ? 'user' : 'bot', item.message));
  }catch(e){
    console.error('Gagal ambil riwayat:', e);
  }
}

async function sendMessage(){
  const text = input.value.trim();
  if(!text) return;

  addBubble('user', text);
  saveHistory('user', text);
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  addTyping();

  try{
    const res = await fetch(API_BASE + CHAT_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId })
    });
    const data = await res.json();
    const reply = data.data?.reply || data.reply || 'Maaf, jawaban tidak tersedia saat ini.';
    removeTyping();
    addBubble('bot', reply);
    saveHistory('bot', reply);
  }catch(e){
    removeTyping();
    addBubble('bot', 'Maaf, terjadi kendala menghubungi server. Coba lagi ya.');
    console.error(e);
  }finally{
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 100) + 'px';
});

loadHistory();
</script>

</body>
</html>
